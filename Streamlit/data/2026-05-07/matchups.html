<script>
(function(){
  var table = document.getElementById('matchupTable');
  var currentView = 'model';
  var parkChecked = true;
  var luckChecked = false;

  /* ---------- Date navigation ---------- */
  var datePicker = document.getElementById('datePicker');
  var dateLabel = document.getElementById('dateLabel');

  function goToDate(dateStr) {
    var url = new URL(window.location.href);
    url.searchParams.set('date', dateStr);
    window.location.href = url.toString();
  }

  dateLabel.addEventListener('click', function(){ datePicker.showPicker ? datePicker.showPicker() : datePicker.click(); });
  dateLabel.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); datePicker.showPicker ? datePicker.showPicker() : datePicker.click(); }});
  datePicker.addEventListener('change', function(){ if (this.value) goToDate(this.value); });

  document.getElementById('datePrev').addEventListener('click', function(e){ e.preventDefault(); goToDate('2026-05-06'); });
  document.getElementById('dateNext').addEventListener('click', function(e){ e.preventDefault(); goToDate('2026-05-08'); });

  /* ---------- Resolve active data-views key ---------- */
  function resolveView() {
    if (currentView === 'model') return parkChecked ? 'model-park' : 'model-nopark';
    if (currentView === 'probability') return parkChecked ? 'probability-park' : 'probability-nopark';
    return luckChecked ? 'luck' : 'history';
  }

  /* ---------- Apply view to table columns ---------- */
  function applyView() {
    if (!table) return;
    var rv = resolveView();
    table.querySelectorAll('th[data-views], td[data-views]').forEach(function(el){
      var views = el.getAttribute('data-views').split(' ');
      el.style.display = (views.indexOf(rv) !== -1) ? '' : 'none';
    });
  }

  /* ---------- View buttons ---------- */
  var viewBtns = document.querySelectorAll('.view-btn');

  function setView(view) {
    currentView = view;
    viewBtns.forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-view') === view);
    });
    syncCheckbox();
    applyView();
  }

  viewBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      setView(btn.getAttribute('data-view'));
    });
  });

  /* ---------- Adjustment checkbox ---------- */
  var adjCheckbox = document.getElementById('adjCheckbox');
  var adjLabel = document.getElementById('adjLabel');

  function syncCheckbox() {
    var isModel = (currentView === 'model' || currentView === 'probability');
    if (isModel) {
      adjLabel.textContent = 'park-adjusted';
      adjCheckbox.checked = parkChecked;
    } else {
      adjLabel.textContent = 'luck-adjusted';
      adjCheckbox.checked = luckChecked;
    }
  }

  adjCheckbox.addEventListener('change', function(){
    var isModel = (currentView === 'model' || currentView === 'probability');
    if (isModel) {
      parkChecked = adjCheckbox.checked;
    } else {
      luckChecked = adjCheckbox.checked;
    }
    applyView();
  });

  /* ---------- Game filter + Search ---------- */
  var gameFilter = document.getElementById('gameFilter');
  var searchInput = document.getElementById('searchInput');

  gameFilter.addEventListener('change', function(){ applyAllFilters(); });
  searchInput.addEventListener('input', function(){ applyAllFilters(); });

  /* ---------- Row filter buttons ---------- */
  var filterAll = document.getElementById('allHittersButton');
  var filterStarters = document.getElementById('startersButton');
  var filterPower = document.getElementById('powerHittersButton');
  var filterContact = document.getElementById('contactHittersButton');
  var filterOpposite = document.getElementById('oppositeHandButton');
  var toggleFilters = [filterStarters, filterPower, filterContact, filterOpposite];

  function activateAll() {
    filterAll.classList.add('active');
    toggleFilters.forEach(function(b){ b.classList.remove('active'); });
    syncFilterStyles();
    applyAllFilters();
  }

  function syncFilterStyles() {
    [filterAll].concat(toggleFilters).forEach(function(b){
      b.style.background = b.classList.contains('active') ? '' : '#fff';
    });
  }

  function toggleFilter(btn) {
    if (btn.classList.contains('active')) {
      btn.classList.remove('active');
      var anyActive = toggleFilters.some(function(b){ return b.classList.contains('active'); });
      if (!anyActive) filterAll.classList.add('active');
    } else {
      btn.classList.add('active');
      filterAll.classList.remove('active');
    }
    syncFilterStyles();
    applyAllFilters();
  }


  filterAll.addEventListener('click', function(){ activateAll(); });
  filterStarters.addEventListener('click', function(){ toggleFilter(filterStarters); });
  filterPower.addEventListener('click', function(){ toggleFilter(filterPower); });
  filterContact.addEventListener('click', function(){ toggleFilter(filterContact); });
  filterOpposite.addEventListener('click', function(){ toggleFilter(filterOpposite); });

  /* ---------- Combined filter logic ---------- */
  function applyAllFilters() {
    if (!table) return;
    var gameVal = gameFilter.value;
    var searchVal = searchInput.value.toLowerCase().trim();
    var isAll = filterAll.classList.contains('active');
    var wantStarter  = filterStarters.classList.contains('active');
    var wantPower    = filterPower.classList.contains('active');
    var wantContact  = filterContact.classList.contains('active');
    var wantOpposite = filterOpposite.classList.contains('active');

    table.querySelectorAll('tbody tr').forEach(function(tr){
      var hidden = false;
      if (gameVal) {
        if ((tr.getAttribute('data-game') || '') !== gameVal) hidden = true;
      }
      if (!hidden && searchVal) {
        if ((tr.getAttribute('data-player') || '').indexOf(searchVal) === -1) hidden = true;
      }
      if (!hidden && !isAll) {
        if (wantStarter  && tr.getAttribute('data-starter')  !== '1') hidden = true;
        if (wantPower    && tr.getAttribute('data-power')    !== '1') hidden = true;
        if (wantContact  && tr.getAttribute('data-contact')  !== '1') hidden = true;
        if (wantOpposite && tr.getAttribute('data-opposite') !== '1') hidden = true;
      }
      tr.classList.toggle('row-hidden', hidden);
    });
  }

  /* ---------- Column sorting ---------- */
  if (table) {
    table.querySelectorAll('thead th').forEach(function(th){
      th.addEventListener('click', function(){
        var colIdx = Array.from(th.parentNode.children).indexOf(th);
        var isNum = th.getAttribute('data-type') === 'number';
        var tbody = table.querySelector('tbody');
        var rows = Array.from(tbody.querySelectorAll('tr'));
        var allTh = table.querySelectorAll('thead th');

        var newDir;
        if (th.classList.contains('sorted-desc')) newDir = 'asc';
        else if (th.classList.contains('sorted-asc')) newDir = 'desc';
        else newDir = isNum ? 'desc' : 'asc';

        allTh.forEach(function(h){
          h.classList.remove('sorted-asc','sorted-desc');
          h.querySelector('.sort-arrow').textContent = '';
        });
        th.classList.add('sorted-' + newDir);
        th.querySelector('.sort-arrow').textContent = newDir === 'asc' ? ' \u25B2' : ' \u25BC';

        rows.sort(function(a, b){
          var ac = a.children[colIdx];
          var bc = b.children[colIdx];
          var av = ac ? (ac.getAttribute('data-sort') || ac.textContent.trim()) : '';
          var bv = bc ? (bc.getAttribute('data-sort') || bc.textContent.trim()) : '';
          if (isNum) { av = parseFloat(av) || 0; bv = parseFloat(bv) || 0; }
          else { av = av.toLowerCase(); bv = bv.toLowerCase(); }
          var cmp = av < bv ? -1 : av > bv ? 1 : 0;
          return newDir === 'asc' ? cmp : -cmp;
        });
        rows.forEach(function(row){ tbody.appendChild(row); });
      });
    });

    /* Default sort: RC (park) desc, then Batter name asc — col 6 is park RC */
    (function(){
      var tbody = table.querySelector('tbody');
      var rows = Array.from(tbody.querySelectorAll('tr'));
      rows.sort(function(a, b){
        var aRC = parseFloat(a.children[6].getAttribute('data-sort')) || 0;
        var bRC = parseFloat(b.children[6].getAttribute('data-sort')) || 0;
        if (aRC !== bRC) return bRC - aRC;
        var aName = (a.children[3].getAttribute('data-sort') || '').toLowerCase();
        var bName = (b.children[3].getAttribute('data-sort') || '').toLowerCase();
        return aName < bName ? -1 : aName > bName ? 1 : 0;
      });
      rows.forEach(function(row){ tbody.appendChild(row); });
    })();
  }

  /* ---------- Info modal ---------- */
  var modal = document.getElementById('infoModal');
  document.getElementById('infoOpen').addEventListener('click', function(){ modal.style.display = 'block'; });
  document.getElementById('infoClose').addEventListener('click', function(){ modal.style.display = 'none'; });
  window.addEventListener('click', function(e){ if (e.target === modal) modal.style.display = 'none'; });

  /* ---------- Conditional formatting (probability columns) ---------- */
  var CF_COLORS = [
    '#fa6e6e','#ff8d89','#ffaaa5','#ffc7c3','#ffe3e0',
    '#ffffff',
    '#e1f4de','#c2e9bd','#a2de9d','#80d27d','#5ac65d'
  ];

  (function applyProbabilityColors(){
    if (!table) return;
    var allRows = Array.from(table.querySelectorAll('tbody tr'));
    if (!allRows.length) return;
    var ths = Array.from(table.querySelectorAll('thead th'));

    ths.forEach(function(th, colIdx){
      var views = th.getAttribute('data-views') || '';
      if (views.indexOf('probability') === -1) return;

      var allCells = allRows.map(function(tr){ return tr.children[colIdx]; }).filter(Boolean);
      var hasCf = allCells.some(function(c){ return c.getAttribute('data-cf'); });
      if (!hasCf) return;

      var direction = allCells[0].getAttribute('data-cf');

      var starterVals = [];
      allRows.forEach(function(tr, i){
        if (tr.getAttribute('data-starter') === '1') {
          starterVals.push(parseFloat(allCells[i].getAttribute('data-sort')) || 0);
        }
      });
      if (!starterVals.length) return;

      var minVal = Math.min.apply(null, starterVals);
      var maxVal = Math.max.apply(null, starterVals);
      var range = maxVal - minVal;

      allCells.forEach(function(c){
        if (range === 0) { c.style.backgroundColor = CF_COLORS[5]; return; }
        var v = parseFloat(c.getAttribute('data-sort')) || 0;
        var pct = Math.max(0, Math.min(1, (v - minVal) / range));
        if (direction === 'lower') pct = 1 - pct;
        var idx = Math.round(pct * (CF_COLORS.length - 1));
        c.style.backgroundColor = CF_COLORS[Math.max(0, Math.min(CF_COLORS.length - 1, idx))];
      });
    });
  })();

  /* ---------- Init ---------- */
  setView('model');
  applyAllFilters();

  /* ---------- Checkout modal gate ---------- */
  if (window.BPCheckoutModalGate) {
    window.BPCheckoutModalGate.registerActions({
      "matchups.filter-all": function () { activateAll(); },
      "matchups.filter-starters": function () { toggleFilter(filterStarters); },
      "matchups.filter-power": function () { toggleFilter(filterPower); },
      "matchups.filter-contact": function () { toggleFilter(filterContact); },
      "matchups.filter-opposite-hand": function () { toggleFilter(filterOpposite); },
      "matchups.games-filter": function (el) { if (el && el.focus) el.focus(); }
    });
  }

})();
</script>

<script>
var __matchupExportData = [];

  var btn = document.getElementById('exportBtn');
  if (!btn) return;
  btn.addEventListener('click', function(){
    if (!__matchupExportData || !__matchupExportData.length) return;
    var ws = XLSX.utils.json_to_sheet(__matchupExportData);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Matchups');
    XLSX.writeFile(wb, 'Matchups_2026-05-07.xlsx');
  });
})();
</script>
